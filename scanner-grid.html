/* ---------------- Helper Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jam = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const men = t => (+t.slice(0, 2)) * 60 + (+t.slice(3, 5));
const inisial = n => n.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();

const sisi = n => {
  const row = Math.ceil(n / 5);
  const col = ((n - 1) % 5) + 1;
  return `Baris ke-${row}, Kolom ke-${col} (Kursi #${n})`;
};

const org = k => P.find(p => p.kursi === k);

function getDiscColorCls(disc) {
  const d = String(disc || "").toUpperCase();
  if (d.includes("PROFIL MENYUSUL") || d.includes("CADANGAN")) return "disc-neutral";
  if (d.startsWith("D")) return "disc-D";
  if (d.startsWith("I")) return "disc-I";
  if (d.startsWith("C")) return "disc-C";
  if (d.startsWith("S")) return "disc-S";
  return "disc-neutral";
}

async function cetakGambarTiket(namaPeserta = "Peserta", selector = ".mobile-pass-card") {
  const el = document.querySelector(selector);
  if (!el) return;

  const btnCetak = document.querySelector("#btn-cetak-kiosk-pass, #btn-cetak-tiket");
  if (btnCetak) {
    btnCetak.disabled = true;
    btnCetak.innerText = "Memproses Gambar...";
  }

  try {
    if (window.html2canvas) {
      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#FCFAF6',
        logging: false,
        onclone: (clonedDoc) => {
          const btns = clonedDoc.querySelectorAll("#btn-cetak-kiosk-pass, #btn-cetak-tiket, [data-tutup-modal]");
          btns.forEach(b => b.style.display = "none");
        }
      });

      const dataUrl = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      const safeName = namaPeserta.replace(/[^a-zA-Z0-9]/g, "_");
      a.download = `Tiket_Grid_Sesi2_${safeName}.png`;
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      alert("Modul pencetak gambar sedang dimuat, silakan coba beberapa detik lagi.");
    }
  } catch (err) {
    console.error("Gagal cetak gambar tiket:", err);
    alert("Gagal mengunduh gambar tiket. Silakan coba kembali.");
  } finally {
    if (btnCetak) {
      btnCetak.disabled = false;
      btnCetak.innerText = "Cetak Gambar Tiket (PNG)";
    }
  }
}

function sesiKini() {
  const n = S.jam;
  return SESI.find(s => men(s.mulai) <= n && men(s.selesai) > n) || null;
}

function tetangga(kursi) {
  const col = (kursi - 1) % 5;
  const kiri = col > 0 ? org(kursi - 1) : null;
  const kanan = col < 4 ? org(kursi + 1) : null;
  return { kiri, kanan };
}

      <div class="count"><b>${S.hadir.size}</b> / ${P.length} Hadir</div>
      <button id="btn-reset-global" style="background:#DC2626; color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;">Reset Presensi</button>
      <div class="clock">${jam(S.jam)}</div>
      <a href="index.html" class="btn-hb">Handbook</a>
    </div>
  </header>
  ${s ? `<div class="now">
    <span class="dot"></span>
    <div>
      <div class="lbl">SEDANG BERLANGSUNG</div>
      <b>${esc(s.nama)}</b>
    </div>
    <div class="meta">${s.mulai} – ${s.selesai}<br>${esc(s.tempat)}${s.oleh ? " · " + esc(s.oleh) : ""}</div>
  </div>` : ""}`;
}

/* ---------------- 5x5 Grid Denah Tempat Duduk ---------------- */
function denah(sorot) {
  const cardsHtml = P.map(p => {
    const k = p.kursi;
    const aku = k === sorot;
    const isHadir = S.hadir.has(p.kode);
    const discCls = getDiscColorCls(p.disc);

    let cls = `grid-card ${discCls} `;
    if (aku) cls += "me ";
    if (isHadir) cls += "filled ";

    return `
      <div class="${cls}" data-pilih-kursi="${k}">
        ${isHadir ? `<div class="card-hadir-badge">&#10003; HADIR</div>` : ""}
        <div class="card-top-num">${k}</div>
        <div class="card-name">${esc(p.panggilan)}</div>
        <div class="card-disc">${esc(p.disc)}</div>
      </div>
    `;
  }).join("");

  return `<div class="map">
    <div class="stage-banner">PANGGUNG · LAYAR · WHITEBOARD</div>
    <div class="map-wrapper-grid">
      <div class="seating-grid">
        ${cardsHtml}
      </div>
    </div>
  </div>`;
}

/* ---------------- Right Side: Kiosk Controls & List ---------------- */
function kioskPanelKanan() {
  let list = P;
  if (S.filter === "hadir") list = list.filter(p => S.hadir.has(p.kode));
  if (S.filter === "belum") list = list.filter(p => !S.hadir.has(p.kode));
  if (S.query.trim()) {
    const q = S.query.toLowerCase().trim();
    list = list.filter(p => p.nama.toLowerCase().includes(q) || p.kode.toLowerCase().includes(q) || String(p.kursi) === q || p.panggilan.toLowerCase().includes(q));
  }

  let checkinTarget = window.location.href.split('?')[0].split('#')[0].replace(/\/(scanner-grid|scanner)(\.html)?\/?$/i, '/checkin.html');
  if (!checkinTarget.includes('checkin.html')) {
    checkinTarget = "https://pirjakun.github.io/Sales-Mistery-Bootcamp/checkin.html";
  }
  checkinTarget += "?sesi=2";

  const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(checkinTarget) + "&color=12357F&bgcolor=FCFAF6";

  return `<div class="kiosk-right">
    <!-- QR Code Kiosk Card -->
    <div class="qr-card">
      <div class="qr-frame">
        <img src="${qrUrl}" alt="QR Code Form Absen Bootcamp">
      </div>
      <div class="qr-info">
        <div class="qr-tag">SCAN QR FORM ABSEN MANDIRI</div>
        <h3>Pindai QR Form Presensi HP</h3>
        <p>Pindai QR ini dari HP Anda untuk mengisi <b>Form Absen Sesi 2</b>. Lokasi <b>Kursi Denah Grid 5x5</b> akan otomatis terkonfirmasi!</p>
        <a href="${checkinTarget}" target="_blank" style="display:inline-block; margin-top:8px; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:4px 10px; font-size:11.5px; font-weight:600; color:#fff; text-decoration:none;">Buka Form Absen Mandiri (HP) &rarr;</a>
      </div>
    </div>`
    </div>

    <!-- List Peserta & Filter -->
    <div class="list-card">
      <div class="list-head">
        <h3>Daftar Presensi Peserta Sesi 2</h3>
        <div class="filter-tabs">
          <button class="filter-btn ${S.filter === 'semua' ? 'active' : ''}" data-filter="semua">Semua (${P.length})</button>
          <button class="filter-btn ${S.filter === 'hadir' ? 'active' : ''}" data-filter="hadir">Hadir (${S.hadir.size})</button>
          <button class="filter-btn ${S.filter === 'belum' ? 'active' : ''}" data-filter="belum">Belum (${P.length - S.hadir.size})</button>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="input-search" placeholder="Cari nama, panggilan, kode, atau nomor kursi..." value="${esc(S.query)}">
      </div>

      <ul class="p-list">
        ${list.map(p => {
          const isHadir = S.hadir.has(p.kode);
          return `
          <li class="p-item" data-pilih-peserta="${p.kode}">
            <div class="av">${inisial(p.nama)}</div>
            <div class="p-info">
              <div class="p-name">
                ${esc(p.nama)}
                <span class="disc-badge ${p.disc}">${p.disc}</span>
              </div>
              <div class="p-role">${esc(p.peran)}</div>
            </div>
            <div class="seat-pill">#${p.kursi}</div>
            <button class="status-btn ${isHadir ? 'is-hadir' : 'not-hadir'}" data-toggle-presensi="${p.kode}">
              ${isHadir ? 'Hadir' : '+ Check-in'}
            </button>
          </li>`;
        }).join("")}
      </ul>
    </div>
  </div>`;
}

/* ---------------- Modal Tiket Digital HP Peserta ---------------- */
function modalTiketDigital() {
  if (!S.showMobilePass || !S.orangAktif) return "";
  const p = S.orangAktif;
  const t = tetangga(p.kursi);

  const kartuNb = (lbl, o) => o ? `
    <div class="nb-box">
      <div class="lbl"><span>${lbl}</span><span>#${o.kursi}</span></div>
      <b>${esc(o.nama)}</b>
      <span class="disc-badge ${o.disc}" style="margin-top:4px; display:inline-block">${o.disc}${o.mbti ? ' (' + o.mbti + ')' : ''} · ${DISC[o.disc] || o.disc}</span>
    </div>` : `
    <div class="nb-box">
      <div class="lbl"><span>${lbl}</span><span>—</span></div>
      <b style="color:var(--ink-3)">Ujung Baris Grid</b>
    </div>`;

  return `
  <div class="modal-overlay" id="modal-bg" data-current-kode="${p.kode}">
    <div class="mobile-pass-card">
      <div class="mobile-header">
        <div class="top-tag">TIKET DIGITAL &amp; SEAT PASS — SESI 2 GRID</div>
        <h2>${esc(p.nama)}</h2>
        <div class="sub">${esc(p.peran)} · Sales Mastery Bootcamp</div>
      </div>
      <div class="mobile-body">
        <div class="hero-seat-box">
          <div class="num">${p.kursi}</div>
          <div class="desc">
            <b>${sisi(p.kursi)}</b>
            <span>Format Denah Grid Classroom (5 Rows x 5 Columns)</span>
          </div>
        </div>

        <div>
          <div class="sec-title">POSISI DUDUK PADA DENAH GRID</div>
          ${denah(p.kursi)}
        </div>

        <div>
          <div class="sec-title">REKAN DUDUK SEBELAH &amp; DiSC PROFILE</div>
          <div class="nb-grid">
            ${kartuNb("SEBELAH KIRI", t.kiri)}
            ${kartuNb("SEBELAH KANAN", t.kanan)}
          </div>
        </div>

        ${(t.kiri && t.kiri.tipsKomunikasi !== "-") || (t.kanan && t.kanan.tipsKomunikasi !== "-") ? `<div class="tip-box">
          <b>Tips Cara Berkomunikasi:</b><br>
          ${t.kiri && t.kiri.tipsKomunikasi !== "-" ? `<b>${esc(t.kiri.panggilan)}:</b> ${esc(t.kiri.tipsKomunikasi)}<br>` : ""}
          ${t.kanan && t.kanan.tipsKomunikasi !== "-" ? `<b>${esc(t.kanan.panggilan)}:</b> ${esc(t.kanan.tipsKomunikasi)}` : ""}
        </div>` : ""}
      </div>
      <div class="mobile-footer" style="flex-wrap:wrap; gap:8px;">
        <div class="status-badge-ok">Hadir (Sesi 2 Grid Presensi)</div>
        <div style="display:flex; gap:8px; width:100%; margin-top:4px;">
          <button class="btn-close-modal" id="btn-cetak-kiosk-pass" style="background:var(--ok); flex:1;">Cetak Gambar Tiket (PNG)</button>
          <button class="btn-close-modal" data-tutup-modal style="flex:1;">Tutup Pass</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderModalSmart() {
  const existingModal = document.getElementById("modal-bg");

  if (!S.showMobilePass || !S.orangAktif) {
    if (existingModal) existingModal.remove();
    return;
  }

  const p = S.orangAktif;

  if (existingModal) {
    if (existingModal.dataset.currentKode === p.kode) {
      return; // Already open for this exact participant
    }
    // New participant check-in! Directly overwrite/replace modal pass in-place
    existingModal.dataset.currentKode = p.kode;
    const cardEl = existingModal.querySelector(".mobile-pass-card");
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = modalTiketDigital().trim();
    const newCard = tempDiv.querySelector(".mobile-pass-card");
    if (cardEl && newCard) {
      cardEl.replaceWith(newCard);
    } else {
      existingModal.remove();
      const node = tempDiv.firstElementChild;
      if (node) document.body.appendChild(node);
    }
    return;
  }

  const html = modalTiketDigital();
  if (html) {
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = html.trim();
    const node = tempDiv.firstElementChild;
    if (node) document.body.appendChild(node);
  }
}

function renderToastSmart() {
  let existingToast = document.querySelector(".toast");
  if (existingToast) existingToast.remove();
}

/* ---------------- Render Main App ---------------- */
function render() {
  const sorotKursi = S.orangAktif ? S.orangAktif.kursi : null;

  const appEl = $("#app");
  if (appEl) {
    let mainEl = $("#app-main");
    if (!mainEl) {
      appEl.innerHTML = `
        <div id="app-header">${bilahAtas()}</div>
        <div id="app-main">
          <main class="kiosk-main">
            <section class="panel">
              <h2>Denah Tempat Duduk Sesi 2 (Grid Classroom 5x5)</h2>
              <div class="hint">Ketuk kartu meja atau nama peserta untuk melihat detail lokasi duduk</div>
              <div id="denah-container">${denah(sorotKursi)}</div>
            </section>
            <section class="panel" style="padding:0; background:transparent; border:0; box-shadow:none;" id="panel-kanan-container">
              ${kioskPanelKanan()}
            </section>
          </main>
        </div>
      `;
    } else {
      const headerEl = $("#app-header");
      const denahEl = $("#denah-container");
      const panelKananEl = $("#panel-kanan-container");
      if (headerEl) headerEl.innerHTML = bilahAtas();
      if (denahEl) denahEl.innerHTML = denah(sorotKursi);
      if (panelKananEl) panelKananEl.innerHTML = kioskPanelKanan();
    }
  }

  // Bind Search Input Focus
  const sInput = $("#input-search");
  if (sInput && document.activeElement !== sInput) {
    sInput.addEventListener("input", e => {
      S.query = e.target.value;
      renderListOnly();
    });
  }

  renderModalSmart();
  renderToastSmart();
}

function renderListOnly() {
  const listEl = $(".p-list");
  if (!listEl) return render();
  
  let list = P;
  if (S.filter === "hadir") list = list.filter(p => S.hadir.has(p.kode));
  if (S.filter === "belum") list = list.filter(p => !S.hadir.has(p.kode));
  if (S.query.trim()) {
    const q = S.query.toLowerCase().trim();
    list = list.filter(p => p.nama.toLowerCase().includes(q) || p.kode.toLowerCase().includes(q) || String(p.kursi) === q || p.panggilan.toLowerCase().includes(q));
  }

  listEl.innerHTML = list.map(p => {
    const isHadir = S.hadir.has(p.kode);
    return `
    <li class="p-item" data-pilih-peserta="${p.kode}">
      <div class="av">${inisial(p.nama)}</div>
      <div class="p-info">
        <div class="p-name">
          ${esc(p.nama)}
          <span class="disc-badge ${p.disc}">${p.disc}</span>
        </div>
        <div class="p-role">${esc(p.peran)}</div>
      </div>
      <div class="seat-pill">#${p.kursi}</div>
      <button class="status-btn ${isHadir ? 'is-hadir' : 'not-hadir'}" data-toggle-presensi="${p.kode}">
        ${isHadir ? 'Hadir' : '+ Check-in'}
      </button>
    </li>`;
  }).join("");
}

function pilihPeserta(kode) {
  const p = P.find(x => x.kode === kode);
  if (!p) return;
  S.hadir.add(p.kode);
  S.orangAktif = p;
  S.showMobilePass = true;
  saveStoragePresensi();
  render();
}

function togglePresensi(kode, e) {
  if (e) e.stopPropagation();
  const p = P.find(x => x.kode === kode);
  if (!p) return;

  if (S.hadir.has(p.kode)) {
    S.hadir.delete(p.kode);
    if (S.orangAktif && S.orangAktif.kode === p.kode) S.orangAktif = null;
    pesan(`Presensi ${p.nama} dibatalkan.`);
  } else {
    S.hadir.add(p.kode);
    S.orangAktif = p;
    S.showMobilePass = true;
    pesan(`Presensi ${p.nama} berhasil dicatat.`);
  }
  saveStoragePresensi();
}

function pesan(t) {
  S.pesan = t;
  render();
  clearTimeout(window._p);
  window._p = setTimeout(() => { S.pesan = null; render(); }, 3000);
}

/* ---------------- Storage Operations ---------------- */
function saveStoragePresensi() {
  try {
    const arr = Array.from(S.hadir);
    localStorage.setItem("smb_hadir_grid", JSON.stringify(arr));
    localStorage.setItem("smb_hadir", JSON.stringify(arr));
  } catch(e){}
}

function syncStoragePresensi(isInitial = false) {
  try {
    const raw = localStorage.getItem("smb_hadir_grid") || localStorage.getItem("smb_hadir");
    if (raw) {
      const hadirArr = JSON.parse(raw);
      let prevCount = S.hadir.size;
      hadirArr.forEach(k => S.hadir.add(k));
      if (!isInitial && S.hadir.size !== prevCount) {
        const latestKey = hadirArr[hadirArr.length - 1];
        const p = P.find(x => x.kode === latestKey);
        if (p) {
          S.orangAktif = p;
          S.showMobilePass = true;
          pesan(`Check-in Sukses: ${p.nama} tersambung ke Kursi #${p.kursi}!`);
        } else {
          render();
        }
      }
    }
  } catch(e){}
}

/* ---------------- Event Listeners ---------------- */
document.addEventListener("click", e => {
  const btnFilter = e.target.closest("[data-filter]");
  if (btnFilter) {
    S.filter = btnFilter.dataset.filter;
    render();
    return;
  }

  const btnToggle = e.target.closest("[data-toggle-presensi]");
  if (btnToggle) {
    togglePresensi(btnToggle.dataset.togglePresensi, e);
    return;
  }

  const itemPeserta = e.target.closest("[data-pilih-peserta]");
  if (itemPeserta) {
    pilihPeserta(itemPeserta.dataset.pilihPeserta);
    return;
  }

  const nodeKursi = e.target.closest("[data-pilih-kursi]");
  if (nodeKursi) {
    const kNum = parseInt(nodeKursi.dataset.pilihKursi, 10);
    const p = org(kNum);
    if (p) pilihPeserta(p.kode);
    return;
  }

  const btnReset = e.target.closest("#btn-reset-global");
  if (btnReset) {
    if (confirm("Kosongkan seluruh data presensi Sesi 2 Grid? Semua peserta akan diatur menjadi Belum Hadir.")) {
      try {
        localStorage.removeItem("smb_hadir_grid");
        localStorage.removeItem("smb_hadir");
      } catch(err){}
      S.hadir.clear();
      S.orangAktif = null;
      S.showMobilePass = false;
      pesan("Seluruh data presensi Sesi 2 telah dikosongkan.");
    }
    return;
  }

  const btnCetakKiosk = e.target.closest("#btn-cetak-kiosk-pass");
  if (btnCetakKiosk) {
    cetakGambarTiket(S.orangAktif ? S.orangAktif.nama : "Peserta", ".mobile-pass-card");
    return;
  }

  const btnTutup = e.target.closest("[data-tutup-modal]");
  if (btnTutup || e.target.id === "modal-bg") {
    S.showMobilePass = false;
    render();
    return;
  }
});

function initRealtimeStream() {
  try {
    const sse = new EventSource("https://ntfy.sh/smb_bootcamp_checkin_2026/sse");
    sse.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data && data.message) {
          const payload = JSON.parse(data.message);
          if (payload && payload.kode) {
            const p = P.find(x => x.kode === payload.kode);
            if (p) {
              S.hadir.add(p.kode);
              S.orangAktif = p;
              S.showMobilePass = true;
              pesan(`Pembaruan Presensi Sesi 2: ${p.nama} telah presensi (Kursi #${p.kursi})!`);
              render();
            }
          }
        }
      } catch(e){}
    };
  } catch(e){}
}

window.addEventListener("storage", () => syncStoragePresensi(false));
setInterval(() => syncStoragePresensi(false), 2000);

setInterval(() => {
  const now = new Date();
  S.jam = now.getHours() * 60 + now.getMinutes();
  const cEl = $(".clock");
  if (cEl) cEl.textContent = jam(S.jam);
}, 30000);

// Initial Setup
function bootScanner() {
  const now = new Date();
  S.jam = now.getHours() * 60 + now.getMinutes();
  syncStoragePresensi(true);
  initRealtimeStream();
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootScanner);
} else {
  bootScanner();
}
</script>
