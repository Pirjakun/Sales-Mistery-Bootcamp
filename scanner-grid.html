/* ---------------- Helper Utilities ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jam = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const men = t => (+t.slice(0, 2)) * 60 + (+t.slice(3, 5));
const inisial = n => n.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();

const sisi = n => {
  const row = Math.ceil(n / 5);
  const col = ((n - 1) % 5) + 1;
  return `Baris ke-${row}, Kolom ke-${col} (Kursi #${n})`;
};

const org = k => P.find(p => p.kursi === k);

function getDiscColorCls(disc) {
  const d = String(disc || "").toUpperCase();
  if (d.includes("PROFIL MENYUSUL") || d.includes("CADANGAN")) return "disc-neutral";
  if (d.startsWith("D")) return "disc-D";
  if (d.startsWith("I")) return "disc-I";
  if (d.startsWith("C")) return "disc-C";
  if (d.startsWith("S")) return "disc-S";
  return "disc-neutral";
}

async function cetakGambarTiket(namaPeserta = "Peserta", selector = ".mobile-pass-card") {
  const el = document.querySelector(selector);
  if (!el) return;

  const btnCetak = document.querySelector("#btn-cetak-kiosk-pass, #btn-cetak-tiket");
  if (btnCetak) {
    btnCetak.disabled = true;
    btnCetak.innerText = "Memproses Gambar...";
  }

  try {
    if (window.html2canvas) {
      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#FCFAF6',
        logging: false,
        onclone: (clonedDoc) => {
          const btns = clonedDoc.querySelectorAll("#btn-cetak-kiosk-pass, #btn-cetak-tiket, [data-tutup-modal]");
          btns.forEach(b => b.style.display = "none");
        }
      });

      const dataUrl = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      const safeName = namaPeserta.replace(/[^a-zA-Z0-9]/g, "_");
      a.download = `Tiket_Grid_Sesi2_${safeName}.png`;
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      alert("Modul pencetak gambar sedang dimuat, silakan coba beberapa detik lagi.");
    }
  } catch (err) {
    console.error("Gagal cetak gambar tiket:", err);
    alert("Gagal mengunduh gambar tiket. Silakan coba kembali.");
  } finally {
    if (btnCetak) {
      btnCetak.disabled = false;
      btnCetak.innerText = "Cetak Gambar Tiket (PNG)";
    }
  }
}

function sesiKini() {
  const n = S.jam;
  return SESI.find(s => men(s.mulai) <= n && men(s.selesai) > n) || null;
}

function tetangga(kursi) {
  const col = (kursi - 1) % 5;
  const kiri = col > 0 ? org(kursi - 1) : null;
  const kanan = col < 4 ? org(kursi + 1) : null;
  return { kiri, kanan };
}

let modalAutoCloseTimer = null;

function renderModalSmart() {
  const existingModal = document.getElementById("modal-bg");

  if (!S.showMobilePass || !S.orangAktif) {
    if (modalAutoCloseTimer) {
      clearTimeout(modalAutoCloseTimer);
      modalAutoCloseTimer = null;
    }
    if (existingModal) existingModal.remove();
    return;
  }

  const p = S.orangAktif;

  if (existingModal) {
    if (existingModal.dataset.currentKode === p.kode) {
      return; // Already open for this exact participant
    }
    // New participant check-in! Directly overwrite/replace modal pass in-place
    existingModal.dataset.currentKode = p.kode;
    const cardEl = existingModal.querySelector(".mobile-pass-card");
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = modalTiketDigital().trim();
    const newCard = tempDiv.querySelector(".mobile-pass-card");
    if (cardEl && newCard) {
      cardEl.replaceWith(newCard);
    } else {
      existingModal.remove();
      const node = tempDiv.firstElementChild;
      if (node) document.body.appendChild(node);
    }
    initZoomableMaps();

    // Reset 5s auto-close timer on new checkin
    if (modalAutoCloseTimer) clearTimeout(modalAutoCloseTimer);
    modalAutoCloseTimer = setTimeout(() => {
      S.showMobilePass = false;
      render();
    }, 5000);
    return;
  }

  const html = modalTiketDigital();
  if (html) {
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = html.trim();
    const node = tempDiv.firstElementChild;
    if (node) document.body.appendChild(node);
  }
  initZoomableMaps();

  // Start 5s auto-close timer
  if (modalAutoCloseTimer) clearTimeout(modalAutoCloseTimer);
  modalAutoCloseTimer = setTimeout(() => {
    S.showMobilePass = false;
    render();
  }, 5000);
}

function renderToastSmart() {

}

function pilihPeserta(kode) {
  const p = P.find(x => x.kode === kode);
  if (!p) return;
  S.hadir.add(p.kode);
  S.orangAktif = p;
  S.showMobilePass = true;
  saveStoragePresensi();
  render();
}

function togglePresensi(kode, e) {
  if (e) e.stopPropagation();
  const p = P.find(x => x.kode === kode);
  if (!p) return;

  if (S.hadir.has(p.kode)) {
    S.hadir.delete(p.kode);
    if (S.orangAktif && S.orangAktif.kode === p.kode) S.orangAktif = null;
    pesan(`Presensi ${p.nama} dibatalkan.`);
  } else {
    S.hadir.add(p.kode);
    S.orangAktif = p;
    S.showMobilePass = true;
    pesan(`Presensi ${p.nama} berhasil dicatat.`);
  }
  saveStoragePresensi();
}

function pesan(t) {
  S.pesan = t;
  render();
  clearTimeout(window._p);
  window._p = setTimeout(() => { S.pesan = null; render(); }, 3000);
}

/* ---------------- Storage Operations ---------------- */
function saveStoragePresensi() {
  try {
    const arr = Array.from(S.hadir);
    localStorage.setItem("smb_hadir_grid", JSON.stringify(arr));
    localStorage.setItem("smb_hadir", JSON.stringify(arr));
  } catch(e){}
}

function syncStoragePresensi(isInitial = false) {
  try {
    const validCodes = new Set(P.map(p => p.kode));
    const raw = localStorage.getItem("smb_hadir_grid") || localStorage.getItem("smb_hadir");
    if (raw) {
      const hadirArr = JSON.parse(raw);
      const cleanArr = hadirArr.filter(k => validCodes.has(k));
      let prevCount = S.hadir.size;
      S.hadir.clear();
      cleanArr.forEach(k => S.hadir.add(k));
      if (cleanArr.length !== hadirArr.length) {
        localStorage.setItem("smb_hadir_grid", JSON.stringify(cleanArr));
      }
      if (!isInitial && S.hadir.size !== prevCount) {
        const latestKey = cleanArr[cleanArr.length - 1];
        const p = P.find(x => x.kode === latestKey);
        if (p) {
          S.orangAktif = p;
          S.showMobilePass = true;
          pesan(`Check-in Sukses: ${p.nama} tersambung ke Kursi #${p.kursi}!`);
        } else {
          render();
        }
      }
    }
  } catch(e){}
}

/* ---------------- Event Listeners ---------------- */
document.addEventListener("click", e => {
  const btnFilter = e.target.closest("[data-filter]");
  if (btnFilter) {
    S.filter = btnFilter.dataset.filter;
    render();
    return;
  }

  const btnToggle = e.target.closest("[data-toggle-presensi]");
  if (btnToggle) {
    togglePresensi(btnToggle.dataset.togglePresensi, e);
    return;
  }

  const itemPeserta = e.target.closest("[data-pilih-peserta]");
  if (itemPeserta) {
    pilihPeserta(itemPeserta.dataset.pilihPeserta);
    return;
  }

  const nodeKursi = e.target.closest("[data-pilih-kursi]");
  if (nodeKursi) {
    const kNum = parseInt(nodeKursi.dataset.pilihKursi, 10);
    const p = org(kNum);
    if (p) pilihPeserta(p.kode);
    return;
  }

  const btnReset = e.target.closest("#btn-reset-global");
  if (btnReset) {
    if (confirm("Kosongkan seluruh data presensi Sesi 2 Grid? Semua peserta akan diatur menjadi Belum Hadir.")) {
      try {
        localStorage.removeItem("smb_hadir_grid");
        localStorage.removeItem("smb_hadir");
      } catch(err){}
      S.hadir.clear();
      S.orangAktif = null;
      S.showMobilePass = false;
      pesan("Seluruh data presensi Sesi 2 telah dikosongkan.");
    }
    return;
  }

  const btnCetakKiosk = e.target.closest("#btn-cetak-kiosk-pass");
  if (btnCetakKiosk) {
    cetakGambarTiket(S.orangAktif ? S.orangAktif.nama : "Peserta", ".mobile-pass-card");
    return;
  }

  const btnTutup = e.target.closest("[data-tutup-modal]");
  if (btnTutup || e.target.id === "modal-bg") {
    if (modalAutoCloseTimer) {
      clearTimeout(modalAutoCloseTimer);
      modalAutoCloseTimer = null;
    }
    S.showMobilePass = false;
    render();
    return;
  }
});

function initRealtimeStream() {
  try {
    const sse = new EventSource("https://ntfy.sh/smb_bootcamp_checkin_2026/sse");
    sse.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data && data.message) {
          const payload = JSON.parse(data.message);
          if (payload && payload.kode) {
            const p = P.find(x => x.kode === payload.kode);
            if (p) {
              S.hadir.add(p.kode);
              S.orangAktif = p;
              S.showMobilePass = true;
              pesan(`Pembaruan Presensi Sesi 2: ${p.nama} telah presensi (Kursi #${p.kursi})!`);
              render();
            }
          }
        }
      } catch(e){}
    };
  } catch(e){}
}

/* ---------------- Zoom & Pan Gesture Engine ---------------- */
function makeZoomable(container) {
  if (!container) return;

  const svg = container.querySelector("svg, .zoomable-svg, .map-wrapper-grid");
  const btnIn = container.querySelector(".btn-zoom-in");
  const btnOut = container.querySelector(".btn-zoom-out");
  const btnReset = container.querySelector(".btn-zoom-reset");
  if (!svg) return;

  if (container._hasZoom) return;
  container._hasZoom = true;

  let scale = 1;
  let pointX = 0;
  let pointY = 0;
  let startX = 0;
  let startY = 0;
  let isDragging = false;
  let initialPinchDist = null;
  let initialScale = 1;

  function updateTransform(smooth = false) {
    scale = Math.min(Math.max(0.3, scale), 3.5);
    if (scale <= 1) {
      pointX = 0;
      pointY = 0;
    }
    svg.style.transition = smooth ? "transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)" : "none";
    svg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  if (btnIn) {
    btnIn.onclick = (e) => { e.stopPropagation(); scale += 0.4; updateTransform(true); };
  }
  if (btnOut) {
    btnOut.onclick = (e) => { e.stopPropagation(); scale -= 0.4; updateTransform(true); };
  }
  if (btnReset) {
    btnReset.onclick = (e) => { e.stopPropagation(); scale = 1; pointX = 0; pointY = 0; updateTransform(true); };
  }

  // Double Tap Zoom
  let lastTap = 0;
  container.addEventListener("touchend", e => {
    if (e.target.closest(".zoom-controls")) return;
    const currentTime = Date.now();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0 && e.touches.length === 0) {
      scale = scale > 1.2 ? 1 : 2.2;
      updateTransform(true);
      e.preventDefault();
    }
    lastTap = currentTime;
  });

  // Touch Pinch & Pan
  container.addEventListener("touchstart", e => {
    if (e.target.closest(".zoom-controls")) return;
    if (e.touches.length === 2) {
      initialPinchDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      initialScale = scale;
    } else if (e.touches.length === 1 && scale > 1) {
      isDragging = true;
      startX = e.touches[0].pageX - pointX;
      startY = e.touches[0].pageY - pointY;
    }
  }, { passive: true });

  container.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && initialPinchDist) {
      if (e.cancelable) e.preventDefault();
      const currentDist = Math.hypot(
        e.touches[0].pageX - e.touches[1].pageX,
        e.touches[0].pageY - e.touches[1].pageY
      );
      scale = initialScale * (currentDist / initialPinchDist);
      updateTransform(false);
    } else if (e.touches.length === 1 && isDragging && scale > 1) {
      if (e.cancelable) e.preventDefault();
      pointX = e.touches[0].pageX - startX;
      pointY = e.touches[0].pageY - startY;
      updateTransform(false);
    }
  }, { passive: false });

  container.addEventListener("touchend", e => {
    if (e.touches.length < 2) initialPinchDist = null;
    if (e.touches.length === 0) isDragging = false;
  });

  // Mouse Drag & Wheel
  container.addEventListener("wheel", e => {
    if (e.cancelable) e.preventDefault();
    scale += e.deltaY < 0 ? 0.25 : -0.25;
    updateTransform(true);
  }, { passive: false });

  container.addEventListener("mousedown", e => {
    if (e.target.closest(".zoom-controls")) return;
    if (scale > 1) {
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
      container.style.cursor = "grabbing";
    }
  });

  window.addEventListener("mousemove", e => {
    if (isDragging && scale > 1) {
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform(false);
    }
  });

  window.addEventListener("mouseup", () => {
    isDragging = false;
    container.style.cursor = "default";
  });
}

function initZoomableMaps() {
  document.querySelectorAll("[data-zoom-container], .map, .map-card-box").forEach(makeZoomable);
}

// Initial Setup
function bootScanner() {
  const now = new Date();
  S.jam = now.getHours() * 60 + now.getMinutes();
  syncStoragePresensi(true);
  initRealtimeStream();
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootScanner);
} else {
  bootScanner();
}
</script>
</body>
</html>
