function denahGrid(sorot) {
  const hadirSet = getHadirSet();
  const P_SESI = getActivePList();

  const cardsHtml = P_SESI.map(p => {
    const k = p.kursi;
    const aku = k === sorot;
    const isHadir = hadirSet.has(p.kode);
    const discCls = getDiscColorCls(p.disc);

    let cls = `grid-card ${discCls} `;
    if (aku) cls += "me ";
    if (isHadir) cls += "filled ";

    return `
      <div class="${cls}">
        ${isHadir ? `<div class="card-hadir-badge">&#10003;</div>` : ""}
        <div class="card-top-num">${k}</div>
        <div class="card-name">${esc(p.panggilan)}</div>
        <div class="card-disc">${esc(p.disc)}</div>
      </div>
    `;
  }).join("");

  return `<div class="map-card-box">
    <div class="stage-tag">PANGGUNG · LAYAR · WHITEBOARD</div>
    <div class="seating-grid-mobile">
      ${cardsHtml}
    </div>
  </div>`;
}

function denah(sorot) {
  return S.sesi === 2 ? denahGrid(sorot) : denahUShape(sorot);
}

function sisi(n) {
  if (S.sesi === 2) {
    const row = Math.ceil(n / 5);
    const col = ((n - 1) % 5) + 1;
    return `Baris ke-${row}, Kolom ke-${col} (Kursi #${n})`;
  }
  if (S.sesi === 3) {
    return n <= 8 ? "Sisi Kiri Meja U (Kursi #" + n + ")"
      : n <= 14 ? "Sisi Tengah Bawah Meja U (Kursi #" + n + ")"
      : "Sisi Kanan Meja U (Kursi #" + n + ")";
  }
  return n <= 8 ? "Sisi Kiri Meja U (Kursi #" + n + ")"
    : n <= 12 ? "Sisi Tengah Bawah Meja U (Kursi #" + n + ")"
    : "Sisi Kanan Meja U (Kursi #" + n + ")";
}

function tetangga(kursi) {
  const P_SESI = getActivePList();
  const orgLocal = k => P_SESI.find(p => p && p.kursi === k);
  if (!kursi) return { kiri: null, kanan: null };
  if (S.sesi === 2) {
    const col = (kursi - 1) % 5;
    return {
      kiri: col > 0 ? orgLocal(kursi - 1) : null,
      kanan: col < 4 ? orgLocal(kursi + 1) : null
    };
  }
  if (S.sesi === 3) {
    if (kursi <= 8) {
      return {
        kiri: kursi > 1 ? orgLocal(kursi - 1) : null,
        kanan: kursi < 8 ? orgLocal(kursi + 1) : null
      };
    } else if (kursi <= 14) {
      return {
        kiri: kursi > 9 ? orgLocal(kursi - 1) : null,
        kanan: kursi < 14 ? orgLocal(kursi + 1) : null
      };
    } else {
      return {
        kiri: kursi > 15 ? orgLocal(kursi - 1) : null,
        kanan: kursi < 22 ? orgLocal(kursi + 1) : null
      };
    }
  }
  if (kursi <= 8) {
    return {
      kiri: kursi > 1 ? orgLocal(kursi - 1) : null,
      kanan: kursi < 8 ? orgLocal(kursi + 1) : null
    };
  } else if (kursi <= 12) {
    return {
      kiri: kursi > 9 ? orgLocal(kursi - 1) : null,
      kanan: kursi < 12 ? orgLocal(kursi + 1) : null
    };
  } else {
    return {
      kiri: kursi > 13 ? orgLocal(kursi - 1) : null,
      kanan: kursi < 20 ? orgLocal(kursi + 1) : null
    };
  }
}

async function cetakGambarTiket(namaPeserta = "Peserta", selector = "#app") {
  const el = document.querySelector(selector);
  if (!el) return;

  const btnCetak = document.querySelector("#btn-cetak-tiket");
  if (btnCetak) {
    btnCetak.disabled = true;
    btnCetak.innerText = "Memproses Gambar...";
  }

  try {
    if (window.html2canvas) {
      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#FCFAF6',
        logging: false,
        onclone: (clonedDoc) => {
          const btns = clonedDoc.querySelectorAll("#btn-cetak-tiket, #btn-kembali");
          btns.forEach(b => b.style.display = "none");
        }
      });

      const dataUrl = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      const safeName = String(namaPeserta || "Peserta").replace(/[^a-zA-Z0-9]/g, "_");
      a.download = `Tiket_Bootcamp_Sesi${S.sesi}_${safeName}.png`;
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      alert("Modul pencetak gambar sedang dimuat, silakan coba beberapa detik lagi.");
    }
  } catch (err) {
    console.error("Gagal cetak gambar tiket:", err);
    alert("Gagal mengunduh gambar tiket. Silakan coba kembali.");
  } finally {
    if (btnCetak) {
      btnCetak.disabled = false;
      btnCetak.innerText = "Unduh Tiket sebagai Gambar (PNG)";
    }
  }
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inisial = n => String(n || "").trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();

function switchSesi(sesiNum) {
  S.sesi = sesiNum;
  S.pDipilih = null;
  S.view = "form";
  render();
}

function init() {
  const params = new URLSearchParams(window.location.search);
  const sesiParam = params.get("sesi");
  if (sesiParam === "1") {
    S.sesi = 1;
  } else if (sesiParam === "2") {
    S.sesi = 2;
  } else {
    S.sesi = 3;
  }

  const kode = params.get("kode");
  const seat = params.get("seat");
  const P_SESI = getActivePList();
  
  if (kode) {
    const found = P_SESI.find(x => x.kode && x.kode.toUpperCase() === kode.trim().toUpperCase());
    if (found) {
      S.pDipilih = found;
    }
  } else if (seat) {
    const found = P_SESI.find(x => x.kursi === parseInt(seat, 10));
    if (found) {
      S.pDipilih = found;
    }
  } else {
    try {
      const myCode = localStorage.getItem("smb_my_code");
      if (myCode) {
        const found = P_SESI.find(x => x.kode === myCode);
        if (found) {
          S.pDipilih = found;
          S.view = "ticket";
        }
      }
    } catch(e){}
  }

  if (S.view === "ticket" && !S.pDipilih) {
    S.view = "form";
  }

  render();
}

function simpanPresensi(p) {
  if (!p || !p.kode) return;
  
  const storageKey = S.sesi === 3 ? "smb_hadir_day3" : (S.sesi === 2 ? "smb_hadir_grid" : "smb_hadir");
  let hadirArr = [];
  try {
    const raw = localStorage.getItem(storageKey);
    if (raw) hadirArr = JSON.parse(raw);
  } catch(e){}

  if (!hadirArr.includes(p.kode)) {
    hadirArr.push(p.kode);
    try {
      localStorage.setItem(storageKey, JSON.stringify(hadirArr));
      localStorage.setItem("smb_hadir", JSON.stringify(hadirArr));
    } catch(e){}
  }

  try {
    localStorage.setItem("smb_my_code", p.kode);
  } catch(e){}
}

    const sel = $("#select-peserta");
    if (sel) {
      sel.addEventListener("change", e => {
        const code = e.target.value;
        S.pDipilih = P_SESI.find(x => x.kode === code) || null;
        render();
      });
    }

    const btnSub = $("#btn-submit-presensi");
    if (btnSub) {
      btnSub.addEventListener("click", (e) => {
        e.preventDefault();
        const selVal = $("#select-peserta") ? $("#select-peserta").value : "";
        const p = (selVal ? P_SESI.find(x => x.kode === selVal) : null) || S.pDipilih;
        if (!p) {
          alert("Silakan pilih nama Anda pada menu 'Pilih Nama Peserta' di atas terlebih dahulu.");
          const selEl = $("#select-peserta");
          if (selEl) {
            selEl.style.borderColor = "var(--warn)";
            selEl.focus();
          }
          return;
        }
        S.pDipilih = p;
        simpanPresensi(p);
        S.view = "success";
        render();
      });
    }

    const btnBuka = $("#btn-buka-tiket");
    if (btnBuka) {
      btnBuka.addEventListener("click", () => {
        S.view = "ticket";
        render();
      });
    }

    const btnCetak = $("#btn-cetak-tiket");
    if (btnCetak) {
      btnCetak.addEventListener("click", () => {
        cetakGambarTiket(S.pDipilih ? S.pDipilih.nama : "Peserta", "#app");
      });
    }

    const btnKembali = $("#btn-kembali");
    if (btnKembali) {
      btnKembali.addEventListener("click", () => {
        try {
          localStorage.removeItem("smb_my_code");
        } catch(e){}
        S.pDipilih = null;
        S.view = "form";
        render();
      });
    }

    const btnResetAll = $("#btn-reset-checkin-global");
    if (btnResetAll) {
      btnResetAll.addEventListener("click", () => {
        if (confirm("Kosongkan seluruh data presensi peserta? Semua peserta akan diatur menjadi Belum Hadir.")) {
          try {
            localStorage.removeItem("smb_hadir");
            localStorage.removeItem("smb_hadir_grid");
            localStorage.removeItem("smb_hadir_day3");
            localStorage.removeItem("smb_my_code");
          } catch(e){}
          S.pDipilih = null;
          S.view = "form";
          alert("Seluruh data presensi telah dikosongkan.");
          render();
        }
      });
    }
  } catch(err) {
    console.error("Render error in checkin.html:", err);
    container.innerHTML = `
      <div class="mobile-head">
        <div class="badge-top">SALES MASTERY BOOTCAMP</div>
        <h1>Form Presensi Peserta</h1>
        <p>Silakan pilih nama Anda dari daftar</p>
      </div>
      <div class="mobile-body">
        <div style="text-align:center; padding:20px; color:var(--warn);">
          <b>Terjadi Kendala Memuat Data</b><br>
          <span style="font-size:12px; color:var(--ink-2);">Silakan klik tombol di bawah untuk mengulang.</span>
        </div>
        <button class="btn-submit" onclick="try{localStorage.removeItem('smb_my_code');}catch(e){} S.view='form'; S.pDipilih=null; render();">
          Buka Form Presensi Utama
        </button>
      </div>
    `;
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
