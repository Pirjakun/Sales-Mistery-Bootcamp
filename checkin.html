function denah(sorot) {
  const hadirSet = getHadirSet();
  const coords = [
    { n: 1, x: 124, y: 55, rot: 0 },
    { n: 2, x: 124, y: 92, rot: 0 },
    { n: 3, x: 124, y: 129, rot: 0 },
    { n: 4, x: 124, y: 166, rot: 0 },
    { n: 5, x: 124, y: 203, rot: 0 },
    { n: 6, x: 124, y: 240, rot: 0 },
    { n: 7, x: 124, y: 277, rot: 0 },
    { n: 8, x: 124, y: 314, rot: 0 },
    { n: 9, x: 188, y: 380, rot: 0 },
    { n: 10, x: 232, y: 380, rot: 0 },
    { n: 11, x: 276, y: 380, rot: 0 },
    { n: 12, x: 320, y: 380, rot: 0 },
    { n: 13, x: 388, y: 55, rot: 0 },
    { n: 14, x: 388, y: 92, rot: 0 },
    { n: 15, x: 388, y: 129, rot: 0 },
    { n: 16, x: 388, y: 166, rot: 0 },
    { n: 17, x: 388, y: 203, rot: 0 },
    { n: 18, x: 388, y: 240, rot: 0 },
    { n: 19, x: 388, y: 277, rot: 0 },
    { n: 20, x: 388, y: 314, rot: 0 }
  ];

  const sortedCoords = [...coords].sort((a, b) => (a.n === sorot ? 1 : 0) - (b.n === sorot ? 1 : 0));

  const svgSeats = sortedCoords.map(item => {
    const n = item.n;
    const p = org(n);
    const aku = n === sorot;
    const isi = p && hadirSet.has(p.kode);
    const pNama = p ? esc(p.panggilan) : "";
    const pDisc = p ? esc(p.disc) : "";

    let cls = "seat-node ";
    if (aku) cls += "me ";
    else if (isi) cls += "filled ";

    function getDiscColorCls(disc) {
      const d = String(disc || "").toUpperCase();
      if (d.startsWith("D")) return "disc-D";
      if (d.startsWith("I")) return "disc-I";
      if (d.startsWith("C")) return "disc-C";
      if (d.startsWith("S")) return "disc-S";
      return "disc-neutral";
    }

    const discCls = getDiscColorCls(pDisc);

    let nameTagSvg = "";
    if (n <= 8) {
      nameTagSvg = `
        <rect x="-96" y="-3" width="90" height="30" rx="6" class="name-shape ${discCls}" />
        <text x="-51" y="12" class="name-label-title" text-anchor="middle">${pNama}</text>
        <text x="-51" y="23" class="name-label-disc" text-anchor="middle">${pDisc}</text>
      `;
    } else if (n <= 12) {
      nameTagSvg = `
        <rect x="-5" y="32" width="38" height="28" rx="5" class="name-shape ${discCls}" />
        <text x="14" y="44" class="name-label-title" text-anchor="middle" style="font-size:10px; font-weight:700;">${pNama}</text>
        <text x="14" y="55" class="name-label-disc" text-anchor="middle" style="font-size:8.5px; font-weight:600;">${pDisc}</text>
      `;
    } else {
      nameTagSvg = `
        <rect x="34" y="-3" width="90" height="30" rx="6" class="name-shape ${discCls}" />
        <text x="79" y="12" class="name-label-title" text-anchor="middle">${pNama}</text>
        <text x="79" y="23" class="name-label-disc" text-anchor="middle">${pDisc}</text>
      `;
    }

    return `
      <g class="${cls}" transform="translate(${item.x}, ${item.y})">
        ${aku ? `<circle class="sonar-ring" cx="14" cy="12.5" fill="none" stroke="#F59E0B" />` : ""}
        ${nameTagSvg}
        <rect width="28" height="25" rx="7" class="seat-rect" />
        <text x="14" y="17" class="seat-num" text-anchor="middle">${n}</text>
        ${aku ? `
          <g class="pin-marker">
            <polygon points="0,-4 -5,-12 5,-12" fill="#DC2626" />
            <circle cx="0" cy="-12" r="5.5" fill="#DC2626" />
            <circle cx="0" cy="-12" r="2.2" fill="#FFFFFF" />
          </g>
        ` : ""}
        <title>Kursi #${n}: ${p ? esc(p.nama) + ' (' + p.disc + ')' : 'Kosong'}</title>
      </g>
    `;
  }).join("");

  return `<div class="map-card-box">
    <div class="stage-tag">PANGGUNG UTAMA · LAYAR &amp; WHITEBOARD</div>
    <div class="map-svg-wrap">
      <svg viewBox="20 30 500 425" width="100%" height="100%" style="width:100%; height:100%; max-height:220px; object-fit:contain; display:block; margin: 0 auto;">
        <g>
          <!-- Wooden U-Shape Table Graphic -->
          <polygon points="160,40 200,40 200,345 340,345 340,40 380,40 380,375 160,375" fill="#C48849" stroke="#784519" stroke-width="2.5"/>
          <polyline points="160,40 160,375 380,375 380,40" fill="none" stroke="#E5A869" stroke-width="2" opacity="0.6"/>
        </g>
        <g>${svgSeats}</g>
      </svg>
    </div>
  </div>`;
}

async function cetakGambarTiket(namaPeserta = "Peserta", selector = "#app") {
  const el = document.querySelector(selector);
  if (!el) return;

  const btnCetak = document.querySelector("#btn-cetak-tiket");
  if (btnCetak) {
    btnCetak.disabled = true;
    btnCetak.innerText = "Memproses Gambar...";
  }

  try {
    if (window.html2canvas) {
      const canvas = await html2canvas(el, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#FCFAF6',
        logging: false,
        onclone: (clonedDoc) => {
          const btns = clonedDoc.querySelectorAll("#btn-cetak-tiket, #btn-kembali");
          btns.forEach(b => b.style.display = "none");
        }
      });

      const dataUrl = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      const safeName = namaPeserta.replace(/[^a-zA-Z0-9]/g, "_");
      a.download = `Tiket_Bootcamp_${safeName}.png`;
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      alert("Modul pencetak gambar sedang dimuat, silakan coba beberapa detik lagi.");
    }
  } catch (err) {
    console.error("Gagal cetak gambar tiket:", err);
    alert("Gagal mengunduh gambar tiket. Silakan coba kembali.");
  } finally {
    if (btnCetak) {
      btnCetak.disabled = false;
      btnCetak.innerText = "Unduh Tiket sebagai Gambar (PNG)";
    }
  }
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inisial = n => n.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();

const org = k => P.find(p => p.kursi === k);
const sisi = n => n <= 8 ? "Sisi Kiri Meja U (Kursi #" + n + ")"
  : n <= 12 ? "Sisi Tengah Bawah Meja U (Kursi #" + n + ")"
  : "Sisi Kanan Meja U (Kursi #" + n + ")";

function tetangga(kursi) {
  return {
    kiri: kursi > 1 ? org(kursi - 1) : null,
    kanan: kursi < 20 ? org(kursi + 1) : null
  };
}

function getHadirSet() {
  const set = new Set();
  try {
    const raw = localStorage.getItem("smb_hadir");
    if (raw) {
      const arr = JSON.parse(raw);
      arr.forEach(k => set.add(k));
    }
  } catch(e){}
  return set;
}

  view: "form", // "form", "success", "ticket"
  pDipilih: null,
  pesan: null
};

/* Load stored presensi or initial query param */
function init() {
  const params = new URLSearchParams(window.location.search);
  const kode = params.get("kode");
  if (kode) {
    const found = P.find(x => x.kode === kode.toUpperCase());
    if (found) S.pDipilih = found;
  } else {
    try {
      const myCode = localStorage.getItem("smb_my_code");
      if (myCode) {
        const found = P.find(x => x.kode === myCode);
        if (found) {
          S.pDipilih = found;
          S.view = "ticket";
        }
      }
    } catch(e){}
  }
  render();
}

function simpanPresensi(p) {
  if (!p || !p.kode) return;
  let hadirArr = [];
  try {
    const raw = localStorage.getItem("smb_hadir");
    if (raw) hadirArr = JSON.parse(raw);
  } catch(e){}
  if (!hadirArr.includes(p.kode)) {
    hadirArr.push(p.kode);
    try {
      localStorage.setItem("smb_hadir", JSON.stringify(hadirArr));
    } catch(e){}
  }

  try {
    localStorage.setItem("smb_my_code", p.kode);
  } catch(e){}

  // Real-time broadcast across physical devices (non-blocking)
  fetch("https://ntfy.sh/smb_bootcamp_checkin_2026", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "checkin", kode: p.kode, timestamp: Date.now() })
  }).catch(() => {});
}

          <b>Tips Cara Berkomunikasi:</b><br>
          ${t.kiri ? `<b>${esc(t.kiri.panggilan)}:</b> ${esc(t.kiri.tipsKomunikasi)}<br>` : ""}
          ${t.kanan ? `<b>${esc(t.kanan.panggilan)}:</b> ${esc(t.kanan.tipsKomunikasi)}` : ""}
        </div>` : ""}

        <div style="display:flex; flex-direction:column; gap:8px;">
          <div class="verified-badge">Terverifikasi Hadir (Sistem Presensi Digital)</div>
          <button class="btn-submit" id="btn-cetak-tiket" style="background:var(--ok); margin-top:4px;">
            Unduh Tiket sebagai Gambar (PNG)
          </button>
          <button class="btn-reset" id="btn-kembali">Kembali ke Form Presensi</button>
        </div>
      </div>
    `;
  }

  // Bind Events
  const sel = $("#select-peserta");
  if (sel) {
    sel.addEventListener("change", e => {
      const code = e.target.value;
      S.pDipilih = P.find(x => x.kode === code) || null;
      render();
    });
  }

  const btnSub = $("#btn-submit-presensi");
  if (btnSub) {
    btnSub.addEventListener("click", (e) => {
      e.preventDefault();
      const selVal = $("#select-peserta") ? $("#select-peserta").value : "";
      const p = (selVal ? P.find(x => x.kode === selVal) : null) || S.pDipilih;
      if (!p) {
        alert("Silakan pilih nama Anda pada menu 'Pilih Nama Peserta' di atas terlebih dahulu.");
        const selEl = $("#select-peserta");
        if (selEl) {
          selEl.style.borderColor = "var(--warn)";
          selEl.focus();
        }
        return;
      }
      S.pDipilih = p;
      simpanPresensi(p);
      S.view = "success";
      render();
    });
  }

  const btnBuka = $("#btn-buka-tiket");
  if (btnBuka) {
    btnBuka.addEventListener("click", () => {
      S.view = "ticket";
      render();
    });
  }

  const btnCetak = $("#btn-cetak-tiket");
  if (btnCetak) {
    btnCetak.addEventListener("click", () => {
      cetakGambarTiket(S.pDipilih ? S.pDipilih.nama : "Peserta", "#app");
    });
  }

  const btnKembali = $("#btn-kembali");
  if (btnKembali) {
    btnKembali.addEventListener("click", () => {
      try {
        localStorage.removeItem("smb_my_code");
      } catch(e){}
      S.pDipilih = null;
      S.view = "form";
      render();
    });
  }

  const btnResetAll = $("#btn-reset-checkin-global");
  if (btnResetAll) {
    btnResetAll.addEventListener("click", () => {
      if (confirm("Kosongkan seluruh data presensi peserta? Semua peserta akan diatur menjadi Belum Hadir.")) {
        try {
          localStorage.removeItem("smb_hadir");
          localStorage.removeItem("smb_my_code");
        } catch(e){}
        S.pDipilih = null;
        S.view = "form";
        alert("Seluruh data presensi telah dikosongkan.");
        render();
      }
    });
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
